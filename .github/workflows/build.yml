name: Compile Kernel Moto G8 (Auto Build)

on:
  push:
    branches: [ "lineage-18.1" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-18.1

      - name: Setup Compilation Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc yasm zlib1g-dev libncurses5-dev

      - name: Setup Toolchain (Clang + GCC)
        run: |
          # Baixar e extrair o seu Clang específico
          curl -LO https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz
          mkdir -p clang
          tar -C clang -xzf clang-r383902b.tar.gz
          
          # Baixar o GCC padrão da Lineage (necessário para bibliotecas auxiliares)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9

      - name: Compile using Lineage Kernel Standards
        run: |
          export PATH="${{ github.workspace }}/clang/bin:${{ github.workspace }}/aarch64-linux-android-4.9/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          mkdir -p out
          make O=out vendor/rav_defconfig
          make -j$(nproc) O=out CC=clang
          make -j$(nproc) O=out modules

      - name: Package Output
        run: |
          mkdir -p compiled_output/modules/vendor/lib/modules
          cp out/arch/arm64/boot/Image.gz-dtb compiled_output/
          find out -name "*.ko" -exec cp {} compiled_output/modules/vendor/lib/modules/ \;

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MotoG8-Kernel-Lineage
          path: compiled_output/*
